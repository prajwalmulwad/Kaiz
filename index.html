<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D Model Viewer</title>
<style>
:root{--bg:#f3f4f6;--panel:#fff;--ink:#1c2430;--muted:#5d6877;--line:#d3d9e1;--accent:#1f5fbf;--on:#fff;--v1:#eef1f5;--v2:#c6cfda;--err:#b42318;--ok:#157f3b}
@media(prefers-color-scheme:dark){:root{--bg:#14181e;--panel:#1d232b;--ink:#e8ecf1;--muted:#9aa5b3;--line:#2d3641;--accent:#6aa5ff;--on:#0b1424;--v1:#2b3441;--v2:#12161c;--err:#ff8a7a;--ok:#5fd68a}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;height:100dvh}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
header div{display:flex;gap:8px}
h1{font-size:16px;font-weight:600;margin:0}
h2{font-size:13px;font-weight:600;margin:0 0 6px;color:var(--muted)}
.btn,select,input{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 11px;min-height:36px}
.btn{cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--on)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on);font-weight:600}
.btn.link{border:0;background:none;color:var(--accent);text-decoration:underline;padding:4px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tools{display:flex;gap:6px;padding:8px 12px;overflow-x:auto;background:var(--panel);border-bottom:1px solid var(--line)}
.tools>*{flex:none}
.sep{width:1px;background:var(--line);margin:0 2px}
#hint{padding:6px 12px;font-size:13px;color:var(--muted);background:var(--panel);border-bottom:1px solid var(--line);min-height:32px}
.main{flex:1;display:flex;min-height:0}
#stage{position:relative;flex:1;min-width:0;overflow:hidden;background:radial-gradient(ellipse at 50% 35%,var(--v1),var(--v2))}
#stage.drag{box-shadow:inset 0 0 0 3px var(--accent)}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}
#labels{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.lab{position:absolute;left:0;top:0;white-space:nowrap;font-size:12px;font-variant-numeric:tabular-nums;background:var(--panel);color:var(--ink);border:1px solid var(--accent);border-radius:4px;padding:2px 6px}
.lab.fcf{display:flex;padding:0;border-color:var(--ink);border-radius:2px;font-family:"Segoe UI Symbol","Noto Sans Symbols 2","Noto Sans Math","Apple Symbols",system-ui,sans-serif}
.fcf span{padding:3px 8px;border-left:1px solid var(--ink)}
.fcf span:first-child{border-left:0;font-size:16px;line-height:1.1}
.fcf b{padding:3px 8px;color:var(--on)}.fcf b.ok{background:var(--ok)}.fcf b.bad{background:var(--err)}
.lab.dat{border-color:var(--ink);border-radius:2px;font-weight:700;font-size:14px;padding:1px 8px}
#empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:6px}
#empty h2{font-size:22px;color:var(--ink);margin:0}
#empty p{margin:0;color:var(--muted);max-width:42ch}
#msg{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:8px;padding:8px 12px;width:max-content;max-width:calc(100% - 20px);cursor:pointer}
#msg.err{border-left-color:var(--err)}
aside{width:320px;flex:none;background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding:12px;display:flex;flex-direction:column;gap:14px}
aside.off{display:none}
aside label{display:flex;flex-direction:column;gap:2px;font-size:13px;color:var(--muted);margin-bottom:8px}
aside input,aside select{width:100%;color:var(--ink)}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:13px;font-variant-numeric:tabular-nums}
dt{color:var(--muted)}dd{margin:0;overflow-wrap:anywhere}
.row{display:flex;gap:6px;margin-bottom:6px}
ul{list-style:none;margin:0;padding:0;font-size:13px}
li{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-top:1px solid var(--line);overflow-wrap:anywhere}
li button{border:0;background:none;color:var(--muted);font-size:18px;line-height:1;cursor:pointer;padding:0 6px;min-width:32px}
[hidden]{display:none!important}
@media(max-width:800px){.main{flex-direction:column}aside{width:auto;max-height:42%;border-left:0;border-top:1px solid var(--line)}}
@media(pointer:coarse){.btn,select,input{min-height:42px}}
</style>
</head>
<body>
<header>
  <h1>3D Model Viewer</h1>
  <div>
    <button class="btn" id="ptog" aria-expanded="true">Panel</button>
    <button class="btn primary" id="open">Open file</button>
  </div>
  <input id="file" type="file" hidden>
</header>

<nav class="tools" aria-label="Tools">
  <button class="btn" data-tool="orbit" aria-pressed="true">Orbit</button>
  <button class="btn" data-tool="feature" aria-pressed="false">Feature</button>
  <button class="btn" data-tool="distance" aria-pressed="false">Distance</button>
  <button class="btn" data-tool="angle" aria-pressed="false">Angle</button>
  <button class="btn" data-tool="radius" aria-pressed="false">Radius</button>
  <button class="btn" data-tool="face" aria-pressed="false">Face angle</button>
  <button class="btn" data-tool="gdt" aria-pressed="false">GD&amp;T</button>
  <span class="sep"></span>
  <button class="btn" id="reset">Reset view</button>
  <button class="btn" id="wire" aria-pressed="false">Wireframe</button>
  <button class="btn" id="grid" aria-pressed="true">Grid</button>
  <button class="btn" id="spin" aria-pressed="false">Rotate</button>
  <button class="btn" id="snap" aria-pressed="true">Snap</button>
  <select id="funit" aria-label="Units the file is in" title="Units the file is in"></select>
  <select id="unit" aria-label="Show results in" title="Show results in"></select>
</nav>
<div id="hint" role="status">Open a file to start.</div>

<div class="main">
  <main id="stage">
    <div id="labels"></div>
    <div id="empty">
      <h2>Drop a 3D file here</h2>
      <p>STL, OBJ, STEP and IGES open right in your browser. Files stay on your computer and are never uploaded.</p>
      <button class="btn primary" id="open2">Choose a file</button>
      <button class="btn link" id="sample">Load a sample model</button>
    </div>
    <div id="msg" role="status" hidden title="Tap to dismiss"></div>
  </main>
  <aside id="side">
    <section><h2>Model</h2><div id="model">No model loaded.</div></section>
    <section id="gdt" hidden>
      <h2>GD&amp;T frame</h2>
      <label>Characteristic <select id="gsym"></select></label>
      <label>Tolerance <input id="gtol" value="0.05" inputmode="decimal"></label>
      <label>Datums (for example A, B) <input id="gref" placeholder="A, B, C"></label>
      <label data-for="∠">Nominal angle (°) <input id="gnom" value="45" inputmode="decimal"></label>
      <label data-for="∥⟂∠">Feature length <input id="glen" inputmode="decimal"></label>
      <button class="btn" id="gfin" hidden>Finish flatness check</button>
    </section>
    <section>
      <h2>Measurements</h2>
      <div class="row"><button class="btn" id="copy">Copy list</button><button class="btn" id="clear">Clear all</button></div>
      <ul id="list"></ul>
    </section>
  </aside>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/loaders/STLLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/loaders/OBJLoader.js"></script>
<script>
const $ = s => document.querySelector(s);
const stage = $('#stage'), OCCT = 'https://cdn.jsdelivr.net/npm/occt-import-js@0.0.23/dist/';

function showMsg(t, err) {
  const m = $('#msg');
  m.hidden = !t; m.className = err ? 'err' : ''; m.textContent = t || '';
}
$('#msg').onclick = () => showMsg('');
$('#open').onclick = $('#open2').onclick = () => $('#file').click();
$('#file').onchange = e => { const f = e.target.files[0]; if (f) openFile(f); e.target.value = ''; };
if (typeof THREE === 'undefined' || !THREE.OrbitControls) {
  showMsg('The 3D library could not be loaded. Check that cdn.jsdelivr.net is reachable from your network.', true);
  throw new Error('three.js missing');
}
const V3 = THREE.Vector3;

/* ---------- scene ---------- */
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 10000);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const cv = renderer.domElement;
stage.prepend(cv);
const controls = new THREE.OrbitControls(camera, cv);
controls.enableDamping = true;
controls.autoRotateSpeed = 2;
scene.add(camera, new THREE.HemisphereLight(0xffffff, 0x667788, 0.9));
const headlight = new THREE.DirectionalLight(0xffffff, 0.9);
headlight.position.set(0.5, 1, 1);
camera.add(headlight);

const holder = new THREE.Group(), marks = new THREE.Group(), tmp = new THREE.Group();
scene.add(holder, marks, tmp);
let grid = null, wf = false, gridOn = true, snapOn = true, yUp = false;
let tool = 'orbit', pend = [], items = [], modelInfo = null, prevK = 1;
const size = new V3();
const maxDim = () => Math.max(size.x, size.y, size.z) || 1;

function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  if (!w || !h) return;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage);

const tv = new V3();
function placeLabels() {
  const w = stage.clientWidth, h = stage.clientHeight;
  for (const it of items) {
    tv.copy(it.anchor).project(camera);
    const vis = tv.z < 1;
    it.el.style.display = vis ? '' : 'none';
    if (vis) it.el.style.transform = `translate(${(tv.x * .5 + .5) * w}px,${(-tv.y * .5 + .5) * h}px) translate(-50%,${it.top ? '-130%' : '-50%'})`;
  }
}
(function loop() { requestAnimationFrame(loop); controls.update(); renderer.render(scene, camera); placeLabels(); })();

/* ---------- model ---------- */
function mat(color) {
  return new THREE.MeshStandardMaterial({ color: color || 0x8399b3, metalness: 0.15, roughness: 0.55, side: THREE.DoubleSide, wireframe: wf });
}
function setWire(on) {
  wf = on;
  holder.traverse(o => { if (o.isMesh) o.material.wireframe = on; });
}
function clearModel() {
  holder.traverse(o => { if (o.isMesh) { o.geometry.dispose(); o.material.dispose(); } });
  holder.clear();
  items.slice().forEach(removeItem);
  clearTemp();
}
function fitView() {
  const dist = maxDim() / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2))) * 1.7;
  camera.position.set(1, 0.7, 1).normalize().multiplyScalar(dist);
  camera.near = dist / 200; camera.far = dist * 200;
  camera.updateProjectionMatrix();
  controls.target.set(0, 0, 0);
  controls.update();
}
const fmt = n => (+n.toPrecision(5)).toString();

function renderModel() {
  if (!modelInfo) return;
  const dl = document.createElement('dl');
  [['File', modelInfo.name], ['Format', modelInfo.fmt], ['Size', modelInfo.dims.map(d => fmt(d * k())).join(' × ') + ' ' + unit()], ['Surface area', fmt(modelInfo.surf * k() * k()) + ' ' + unit() + '²'], ['Volume (closed)', fmt(modelInfo.vol * k() * k() * k()) + ' ' + unit() + '³'], ['Triangles', modelInfo.tris.toLocaleString()]].forEach(([a, v]) => {
    const dt = document.createElement('dt'), dd = document.createElement('dd');
    dt.textContent = a; dd.textContent = v; dl.append(dt, dd);
  });
  $('#model').textContent = ''; $('#model').append(dl);
}

function showModel(obj, name, bytes, ext) {
  clearModel();
  yUp = ext === 'obj';
  if (!yUp) obj.rotation.x = -Math.PI / 2;   // CAD files are Z-up
  holder.add(obj);
  setWire(wf);
  obj.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(obj);
  box.getSize(size);
  obj.position.sub(box.getCenter(new V3()));
  obj.updateMatrixWorld(true);

  let tris = 0, surf = 0, vol = 0;
  const pa = new V3(), pb = new V3(), pc = new V3(), t1 = new V3(), t2 = new V3();
  obj.traverse(o => {
    if (!o.isMesh) return;
    const g = o.geometry, pos = g.attributes.position, ix = g.index, nt = (ix ? ix.count : pos.count) / 3;
    tris += nt;
    for (let t = 0; t < nt; t++) {
      pa.fromBufferAttribute(pos, ix ? ix.getX(3 * t) : 3 * t);
      pb.fromBufferAttribute(pos, ix ? ix.getX(3 * t + 1) : 3 * t + 1);
      pc.fromBufferAttribute(pos, ix ? ix.getX(3 * t + 2) : 3 * t + 2);
      surf += t1.subVectors(pb, pa).cross(t2.subVectors(pc, pa)).length() / 2;
      vol += pa.dot(t1.crossVectors(pb, pc)) / 6;
    }
  });
  const dims = yUp ? [size.x, size.y, size.z] : [size.x, size.z, size.y];

  if (grid) { scene.remove(grid); grid.geometry.dispose(); grid.material.dispose(); }
  grid = new THREE.GridHelper((Math.max(size.x, size.z) * 2.5) || 10, 20, 0x8896a8, 0x8896a8);
  grid.material.transparent = true; grid.material.opacity = 0.3;
  grid.position.y = -size.y / 2; grid.visible = gridOn;
  scene.add(grid);
  fitView();

  const kb = bytes ? ' · ' + (bytes >= 1048576 ? (bytes / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(bytes / 1024)) + ' KB') : '';
  modelInfo = { name, fmt: ext.toUpperCase() + kb, dims, tris: Math.round(tris), surf, vol: Math.abs(vol) };
  if (['step', 'stp', 'iges', 'igs'].includes(ext)) $('#funit').value = 'mm';   // STEP/IGES are normally read in mm
  renderModel();
  prevK = k();
  $('#glen').value = fmt(maxDim() * prevK);
  $('#empty').hidden = true;
  showMsg('');
  setTool('orbit');
}

/* ---------- parsers ---------- */
function parseSTL(buf) {
  const geo = new THREE.STLLoader().parse(buf);
  if (!geo.attributes.normal) geo.computeVertexNormals();
  return new THREE.Mesh(geo, mat());
}
function parseOBJ(buf) {
  const obj = new THREE.OBJLoader().parse(new TextDecoder().decode(buf));
  let n = 0;
  obj.traverse(o => {
    if (!o.isMesh) return;
    n++;
    if (!o.geometry.attributes.normal) o.geometry.computeVertexNormals();
    o.material = mat();
  });
  if (!n) throw new Error('No surfaces found in this OBJ file.');
  return obj;
}
let occtReady;
function loadOcct() {
  if (!occtReady) occtReady = new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = OCCT + 'occt-import-js.js';
    s.onload = () => occtimportjs({ locateFile: f => OCCT + f }).then(resolve, reject);
    s.onerror = () => { occtReady = null; reject(new Error('The STEP/IGES reader could not be loaded. Check that cdn.jsdelivr.net is reachable from your network.')); };
    document.head.appendChild(s);
  });
  return occtReady;
}
async function parseCAD(buf, ext) {
  const occt = await loadOcct();
  const data = new Uint8Array(buf);
  const r = (ext === 'step' || ext === 'stp') ? occt.ReadStepFile(data, null) : occt.ReadIgesFile(data, null);
  if (!r.success || !r.meshes.length) throw new Error('No geometry found in this file.');
  const group = new THREE.Group();
  for (const m of r.meshes) {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(m.attributes.position.array, 3));
    if (m.attributes.normal) g.setAttribute('normal', new THREE.Float32BufferAttribute(m.attributes.normal.array, 3));
    g.setIndex(new THREE.Uint32BufferAttribute(m.index.array, 1));
    if (!m.attributes.normal) g.computeVertexNormals();
    const c = m.color ? new THREE.Color(m.color[0], m.color[1], m.color[2]) : null;
    const mesh = new THREE.Mesh(g, mat(c));
    if (m.brep_faces) mesh.userData.faces = m.brep_faces;
    group.add(mesh);
  }
  return group;
}
async function openFile(file) {
  if (typeof THREE === 'undefined') {
    showMsg('The 3D library did not load, so files cannot open. Check that cdn.jsdelivr.net is reachable, and open this page from your computer (not a preview).', true);
    return;
  }
  const ext = file.name.split('.').pop().toLowerCase();
  if (['catpart', 'catproduct', 'cgr', '3dxml'].includes(ext)) {
    showMsg('CATIA files (.CATPart, .CATProduct) are proprietary and cannot be read in a browser. In CATIA, choose File > Save As, pick STEP (.stp), then open that file here.', true);
    return;
  }
  if (!['stl', 'obj', 'step', 'stp', 'iges', 'igs'].includes(ext)) {
    showMsg('This file type is not supported. Use STL, OBJ, STEP or IGES.', true);
    return;
  }
  showMsg('Reading ' + file.name + '…');
  try {
    const buf = await file.arrayBuffer();
    const obj = ext === 'stl' ? parseSTL(buf) : ext === 'obj' ? parseOBJ(buf) : await parseCAD(buf, ext);
    showModel(obj, file.name, file.size, ext);
  } catch (e) {
    showMsg('Could not open this file. ' + (e && e.message ? e.message : ''), true);
  }
}

/* ---------- measuring ---------- */
const TO_MM = { mm: 1, cm: 10, m: 1000, in: 25.4, ft: 304.8 };
Object.keys(TO_MM).forEach(u => [['#funit', 'File in '], ['#unit', 'Show ']].forEach(([id, pre]) => {
  const o = document.createElement('option'); o.value = u; o.textContent = pre + u; $(id).append(o);
}));
const unit = () => $('#unit').value;
const k = () => TO_MM[$('#funit').value] / TO_MM[unit()];   // file units -> display units
const lineMat = new THREE.LineBasicMaterial({ color: 0xf59e0b, depthTest: false });
const dotMat = new THREE.MeshBasicMaterial({ color: 0xf59e0b, depthTest: false });
const fileVec = v => yUp ? v.clone() : new V3(v.x, -v.z, v.y);

const SYMS = [['⏥', 'Flatness'], ['∥', 'Parallelism'], ['⟂', 'Perpendicularity'], ['∠', 'Angularity'], ['⌖', 'Position'],
  ['◎', 'Concentricity'], ['⌯', 'Symmetry'], ['○', 'Circularity'], ['⌭', 'Cylindricity'], ['⏤', 'Straightness'],
  ['⌒', 'Profile of a line'], ['⌓', 'Profile of a surface'], ['↗', 'Circular runout'], ['⌰', 'Total runout'], ['D', 'Datum feature']];
SYMS.forEach(([s, n]) => { const o = document.createElement('option'); o.value = s; o.textContent = (s === 'D' ? '' : s + '  ') + n; $('#gsym').append(o); });
const symName = s => (SYMS.find(x => x[0] === s) || [, s])[1];

function hint(msg) {
  let t = msg;
  if (!t) {
    const n = pend.length, s = $('#gsym').value;
    t = !holder.children.length ? 'Open a file to start.'
      : tool === 'orbit' ? 'Drag to rotate, scroll or pinch to zoom, right-drag to pan.'
      : tool === 'feature' ? 'Feature: tap a face or hole to measure it.'
      : tool === 'distance' ? `Distance: tap point ${n + 1} of 2.`
      : tool === 'angle' ? `Angle: tap point ${n + 1} of 3 (the 2nd is the corner).`
      : tool === 'radius' ? `Radius: tap 3 points on a round edge (${n + 1} of 3).`
      : tool === 'face' ? `Face angle: tap face ${n + 1} of 2.`
      : s === '⏥' ? `Flatness: tap 4 or more points on one face (${n} so far), then Finish.`
      : '∥⟂∠'.includes(s) ? (n ? 'Now tap the feature face.' : 'Tap the datum face first.')
      : 'Tap the surface to place the symbol.';
  }
  $('#hint').textContent = t;
}

function sphere(p) {
  const m = new THREE.Mesh(new THREE.SphereGeometry(maxDim() / 140, 12, 8), dotMat);
  m.position.copy(p); m.renderOrder = 999;
  return m;
}
function line(pts) {
  const l = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), lineMat);
  l.renderOrder = 999;
  return l;
}
function clearTemp() { tmp.children.slice().forEach(o => { o.geometry.dispose(); tmp.remove(o); }); }
function removeItem(it) {
  marks.remove(it.g);
  it.g.traverse(o => o.geometry && o.geometry.dispose());
  it.el.remove();
  items = items.filter(x => x !== it);
  renderList();
}
function renderList() {
  const ul = $('#list'); ul.textContent = '';
  if (!items.length) { const li = document.createElement('li'); li.textContent = 'Nothing measured yet.'; ul.append(li); return; }
  items.forEach(it => {
    const li = document.createElement('li'), s = document.createElement('span'), b = document.createE
