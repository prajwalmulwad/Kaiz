<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D Model Viewer</title>
<style>
:root{--bg:#f3f4f6;--panel:#fff;--ink:#1c2430;--muted:#5d6877;--line:#d3d9e1;--accent:#1f5fbf;--on:#fff;--v1:#eef1f5;--v2:#c6cfda;--err:#b42318}
@media(prefers-color-scheme:dark){:root{--bg:#14181e;--panel:#1d232b;--ink:#e8ecf1;--muted:#9aa5b3;--line:#2d3641;--accent:#6aa5ff;--on:#0b1424;--v1:#2b3441;--v2:#12161c;--err:#ff8a7a}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
h1{font-size:16px;font-weight:600;margin:0}
.btn{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 12px;min-height:36px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--on)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on);font-weight:600}
.btn.link{border:0;background:none;color:var(--accent);text-decoration:underline;padding:4px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#stage{position:relative;flex:1;min-height:0;overflow:hidden;background:radial-gradient(ellipse at 50% 35%,var(--v1),var(--v2))}
#stage.drag{box-shadow:inset 0 0 0 3px var(--accent)}
#stage canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:6px}
#empty h2{margin:0;font-size:22px;font-weight:600}
#empty p{margin:0;color:var(--muted);max-width:42ch}
#info,#msg,#bar{position:absolute;background:var(--panel);border:1px solid var(--line);border-radius:8px}
#info{top:12px;left:12px;padding:10px 12px;max-width:min(300px,calc(100% - 24px));font-size:13px}
#info b{display:block;font-size:14px;overflow-wrap:anywhere}
#info span{color:var(--muted)}
#info dl{margin:6px 0 0;display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-variant-numeric:tabular-nums}
#info dt{color:var(--muted)}#info dd{margin:0}
#msg{top:12px;left:50%;transform:translateX(-50%);padding:10px 14px;max-width:min(460px,calc(100% - 24px));border-left:4px solid var(--accent);width:max-content}
#msg.err{border-left-color:var(--err)}
#bar{bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:6px;padding:6px;flex-wrap:wrap;justify-content:center;max-width:calc(100% - 24px)}
[hidden]{display:none!important}
@media(max-width:560px){#info{top:auto;bottom:64px}#msg{top:8px}}
</style>
</head>
<body>
<header>
  <h1>3D Model Viewer</h1>
  <button class="btn primary" id="open">Open file</button>
  <input id="file" type="file" hidden accept=".stl,.obj,.step,.stp,.iges,.igs,.catpart,.catproduct">
</header>

<main id="stage">
  <div id="empty">
    <h2>Drop a 3D file here</h2>
    <p>STL, OBJ, STEP and IGES open right in your browser. Files stay on your computer and are never uploaded.</p>
    <button class="btn link" id="sample">Load a sample model</button>
  </div>
  <div id="info" hidden></div>
  <div id="msg" role="status" hidden></div>
  <div id="bar" hidden>
    <button class="btn" id="reset">Reset view</button>
    <button class="btn" id="wire" aria-pressed="false">Wireframe</button>
    <button class="btn" id="grid" aria-pressed="true">Grid</button>
    <button class="btn" id="spin" aria-pressed="false">Auto-rotate</button>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/loaders/STLLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/loaders/OBJLoader.js"></script>
<script>
const $ = s => document.querySelector(s);
const stage = $('#stage');
const OCCT = 'https://cdn.jsdelivr.net/npm/occt-import-js@0.0.23/dist/';

function showMsg(text, err) {
  const m = $('#msg');
  m.hidden = !text;
  m.className = err ? 'err' : '';
  m.textContent = text || '';
}

if (typeof THREE === 'undefined' || !THREE.OrbitControls) {
  showMsg('The 3D library could not be loaded. Check that cdn.jsdelivr.net is reachable from your network.', true);
  throw new Error('three.js missing');
}

/* ---------- scene ---------- */
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 10000);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
stage.prepend(renderer.domElement);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.autoRotateSpeed = 2;
scene.add(camera, new THREE.HemisphereLight(0xffffff, 0x667788, 0.9));
const headlight = new THREE.DirectionalLight(0xffffff, 0.9);
headlight.position.set(0.5, 1, 1);
camera.add(headlight);

const holder = new THREE.Group();
scene.add(holder);
let grid = null, mats = [], wf = false, gridOn = true;
const size = new THREE.Vector3();

function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  if (!w || !h) return;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage);
(function loop() { requestAnimationFrame(loop); controls.update(); renderer.render(scene, camera); })();

/* ---------- helpers ---------- */
function mat(color) {
  const m = new THREE.MeshStandardMaterial({
    color: color || 0x8399b3, metalness: 0.15, roughness: 0.55,
    side: THREE.DoubleSide, wireframe: wf
  });
  mats.push(m);
  return m;
}

function clearModel() {
  holder.traverse(o => { if (o.geometry) o.geometry.dispose(); });
  mats.forEach(m => m.dispose());
  mats = [];
  holder.clear();
}

function fitView() {
  const d = Math.max(size.x, size.y, size.z) || 1;
  const dist = d / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2))) * 1.7;
  camera.position.set(1, 0.7, 1).normalize().multiplyScalar(dist);
  camera.near = dist / 200;
  camera.far = dist * 200;
  camera.updateProjectionMatrix();
  controls.target.set(0, 0, 0);
  controls.update();
}

const fmt = n => (+n.toPrecision(4)).toLocaleString();

function showModel(obj, name, bytes, ext) {
  clearModel();
  const yUp = ext === 'obj';
  if (!yUp) obj.rotation.x = -Math.PI / 2;   // CAD files are Z-up
  holder.add(obj);
  obj.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(obj);
  box.getSize(size);
  obj.position.sub(box.getCenter(new THREE.Vector3()));

  let tris = 0;
  obj.traverse(o => {
    if (!o.isMesh) return;
    const g = o.geometry;
    tris += (g.index ? g.index.count : g.attributes.position.count) / 3;
  });
  const dims = yUp ? [size.x, size.y, size.z] : [size.x, size.z, size.y];

  if (grid) { scene.remove(grid); grid.geometry.dispose(); grid.material.dispose(); }
  grid = new THREE.GridHelper((Math.max(size.x, size.z) * 2.5) || 10, 20, 0x8896a8, 0x8896a8);
  grid.material.transparent = true;
  grid.material.opacity = 0.3;
  grid.position.y = -size.y / 2;
  grid.visible = gridOn;
  scene.add(grid);
  fitView();

  const info = $('#info');
  info.textContent = '';
  const title = document.createElement('b');
  title.textContent = name;
  const sub = document.createElement('span');
  sub.textContent = ext.toUpperCase() + (bytes ? ' · ' + (bytes / 1048576 >= 1 ? (bytes / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(bytes / 1024)) + ' KB') : '');
  const dl = document.createElement('dl');
  [['Size', dims.map(fmt).join(' × ')], ['Triangles', Math.round(tris).toLocaleString()]].forEach(([k, v]) => {
    const dt = document.createElement('dt'), dd = document.createElement('dd');
    dt.textContent = k; dd.textContent = v; dl.append(dt, dd);
  });
  info.append(title, sub, dl);
  info.hidden = false;
  $('#bar').hidden = false;
  $('#empty').hidden = true;
  showMsg('');
}

/* ---------- parsers ---------- */
function parseSTL(buf) {
  const geo = new THREE.STLLoader().parse(buf);
  if (!geo.attributes.normal) geo.computeVertexNormals();
  return new THREE.Mesh(geo, mat());
}

function parseOBJ(buf) {
  const obj = new THREE.OBJLoader().parse(new TextDecoder().decode(buf));
  let n = 0;
  obj.traverse(o => {
    if (!o.isMesh) return;
    n++;
    if (!o.geometry.attributes.normal) o.geometry.computeVertexNormals();
    o.material = mat();
  });
  if (!n) throw new Error('No surfaces found in this OBJ file.');
  return obj;
}

let occtReady;
function loadOcct() {
  if (!occtReady) occtReady = new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = OCCT + 'occt-import-js.js';
    s.onload = () => occtimportjs({ locateFile: f => OCCT + f }).then(resolve, reject);
    s.onerror = () => { occtReady = null; reject(new Error('The STEP/IGES reader could not be loaded. Check that cdn.jsdelivr.net is reachable from your network.')); };
    document.head.appendChild(s);
  });
  return occtReady;
}

async function parseCAD(buf, ext) {
  const occt = await loadOcct();
  const data = new Uint8Array(buf);
  const r = (ext === 'step' || ext === 'stp') ? occt.ReadStepFile(data, null) : occt.ReadIgesFile(data, null);
  if (!r.success || !r.meshes.length) throw new Error('No geometry found in this file.');
  const group = new THREE.Group();
  for (const m of r.meshes) {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(m.attributes.position.array, 3));
    if (m.attributes.normal) g.setAttribute('normal', new THREE.Float32BufferAttribute(m.attributes.normal.array, 3));
    g.setIndex(new THREE.Uint32BufferAttribute(m.index.array, 1));
    if (!m.attributes.normal) g.computeVertexNormals();
    const c = m.color ? new THREE.Color(m.color[0], m.color[1], m.color[2]) : null;
    group.add(new THREE.Mesh(g, mat(c)));
  }
  return group;
}

/* ---------- open a file ---------- */
async function openFile(file) {
  const ext = file.name.split('.').pop().toLowerCase();
  if (['catpart', 'catproduct', 'cgr', '3dxml'].includes(ext)) {
    showMsg('CATIA files (.CATPart, .CATProduct) are proprietary and cannot be read in a browser. In CATIA, choose File > Save As, pick STEP (.stp), then open that file here.', true);
    return;
  }
  if (!['stl', 'obj', 'step', 'stp', 'iges', 'igs'].includes(ext)) {
    showMsg('This file type is not supported. Use STL, OBJ, STEP or IGES.', true);
    return;
  }
  showMsg('Reading ' + file.name + '…');
  try {
    const buf = await file.arrayBuffer();
    const obj = ext === 'stl' ? parseSTL(buf) : ext === 'obj' ? parseOBJ(buf) : await parseCAD(buf, ext);
    showModel(obj, file.name, file.size, ext);
  } catch (e) {
    showMsg('Could not open this file. ' + (e && e.message ? e.message : ''), true);
  }
}

/* ---------- UI ---------- */
$('#open').onclick = () => $('#file').click();
$('#file').onchange = e => { const f = e.target.files[0]; if (f) openFile(f); e.target.value = ''; };
$('#sample').onclick = () => showModel(new THREE.Mesh(new THREE.TorusKnotGeometry(10, 3, 220, 32), mat()), 'Sample torus knot', 0, 'obj');
$('#reset').onclick = fitView;

function toggle(id, fn) {
  const b = $(id);
  b.onclick = () => { const on = b.getAttribute('aria-pressed') !== 'true'; b.setAttribute('aria-pressed', on); fn(on); };
}
toggle('#wire', on => { wf = on; mats.forEach(m => m.wireframe = on); });
toggle('#grid', on => { gridOn = on; if (grid) grid.visible = on; });
toggle('#spin', on => { controls.autoRotate = on; });

['dragenter', 'dragover'].forEach(t => addEventListener(t, e => { e.preventDefault(); stage.classList.add('drag'); }));
addEventListener('dragleave', e => { if (!e.relatedTarget) stage.classList.remove('drag'); });
addEventListener('drop', e => {
  e.preventDefault();
  stage.classList.remove('drag');
  const f = e.dataTransfer.files[0];
  if (f) openFile(f);
});
</script>
</body>
</html>
